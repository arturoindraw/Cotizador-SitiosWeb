<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotizador de sitios web — Colombia &amp; Panamá</title>

<!-- Tema antes del primer render (evita parpadeo claro/oscuro) -->
<script>
(function(){
  var theme = null;
  try{ theme = (JSON.parse(localStorage.getItem("cotizador_prefs") || "{}") || {}).theme; }catch(e){}
  if(theme !== "dark" && theme !== "light"){
    try{ theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }catch(e){ theme = "light"; }
  }
  document.documentElement.setAttribute("data-theme", theme);
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   1. TOKENS
   ===================================================================== */
:root{
  --bg:#FAF8F5;
  --bg-alt:#F1EEE8;
  --surface:#FFFFFF;
  --surface-2:#FBFAF8;
  --border:#E7E2D9;
  --text:#171512;
  --text-muted:#6E685F;
  --text-faint:#9A948A;
  --black:#0E0D0C;
  --orange-1:#FF6A1A;
  --orange-2:#FF9A3D;
  --orange-soft:#FFF0E3;
  --orange-soft-border:#FFD5AE;
  --accent-grad:linear-gradient(135deg,var(--orange-1) 0%,var(--orange-2) 100%);
  --danger:#C8372D;
  --wa:#25D366;
  --badge-bg:var(--black);
  --badge-fg:#FFFFFF;
  --btn-dark-bg:var(--black);
  --btn-dark-border:var(--black);
  --shadow-sm:0 1px 2px rgba(20,16,10,.06);
  --shadow-md:0 8px 24px rgba(20,16,10,.08);
  --radius-md:16px;
  --radius-lg:22px;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#111011;
  --bg-alt:#0B0A0A;
  --surface:#1A1815;
  --surface-2:#201E1A;
  --border:#332F29;
  --text:#F5F1EA;
  --text-muted:#B3ABA0;
  --text-faint:#847B70;
  --orange-soft:#2B1B0F;
  --orange-soft-border:#5A3418;
  --danger:#FF7A6B;
  --badge-bg:var(--accent-grad);
  --badge-fg:#1A0E00;
  --btn-dark-bg:var(--surface-2);
  --btn-dark-border:var(--border);
  --shadow-sm:0 1px 2px rgba(0,0,0,.3);
  --shadow-md:0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}

/* =====================================================================
   2. BASE
   ===================================================================== */
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
  min-height:100vh;
}
h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-.01em;}
img,svg{max-width:100%;}
button,input{font-family:inherit;}
button{cursor:pointer;color:inherit;}   /* color:inherit evita texto negro sobre fondo oscuro */
a{color:inherit;}
::selection{background:var(--orange-2);color:#1a0e00;}
:focus-visible{outline:2px solid var(--orange-1);outline-offset:2px;}
.icon{width:20px;height:20px;flex-shrink:0;}
.icon-lg{width:26px;height:26px;}
.no-js{padding:24px;text-align:center;font-weight:700;}

/* =====================================================================
   3. HEADER + CONTROLES
   ===================================================================== */
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 80px;}
header.top{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}
.top-inner{
  max-width:1280px;margin:0 auto;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{
  width:36px;height:36px;border-radius:10px;background:var(--accent-grad);
  display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-family:'Space Grotesk';
  box-shadow:var(--shadow-sm);flex-shrink:0;
}
.brand-text .name{font-weight:700;font-size:15px;line-height:1.1;}
.brand-text .tag{font-size:11.5px;color:var(--text-muted);}
.controls-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.pill-group{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:3px;gap:2px;}
.pill-btn{
  border:none;background:transparent;color:var(--text-muted);font-size:12.5px;font-weight:700;
  padding:6px 12px;border-radius:999px;transition:all .15s ease;white-space:nowrap;
}
.pill-btn.active{background:var(--accent-grad);color:#fff;box-shadow:var(--shadow-sm);}
.icon-btn{
  width:34px;height:34px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;color:var(--text);transition:transform .15s ease;
}
.icon-btn:hover{transform:scale(1.06);}
.icon-btn .icon{width:17px;height:17px;}

/* =====================================================================
   4. HERO + RECOMENDADOR
   ===================================================================== */
.hero{padding:44px 0 28px;}
.hero-kicker{
  display:inline-flex;align-items:center;gap:8px;background:var(--orange-soft);
  border:1px solid var(--orange-soft-border);color:var(--orange-1);font-size:12.5px;font-weight:700;
  padding:6px 12px;border-radius:999px;margin-bottom:16px;
}
.hero h1{font-size:clamp(28px,4.2vw,44px);line-height:1.08;margin:0 0 14px;max-width:16ch;}
.hero h1 .grad{background:var(--accent-grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.hero p{font-size:16px;color:var(--text-muted);max-width:56ch;line-height:1.55;margin:0;}

.reco{
  padding:18px 20px;background:var(--orange-soft);
  border:1px solid var(--orange-soft-border);border-radius:var(--radius-md);
}
.reco[hidden]{display:none;}
.reco-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;}
.reco-title{margin:0;font-size:14px;color:var(--orange-1);}
.reco-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.reco-btn{
  border:1.5px solid var(--orange-soft-border);background:var(--surface);color:var(--text);
  font-weight:700;font-size:12.5px;padding:10px 12px;border-radius:12px;
  transition:border-color .15s ease, transform .12s ease;
}
.reco-btn:hover{border-color:var(--orange-1);transform:translateY(-1px);}
.reco-btn.active{background:var(--accent-grad);border-color:transparent;color:#fff;}

/* =====================================================================
   5. SECCIONES DEL FORMULARIO
   ===================================================================== */
.layout{display:grid;grid-template-columns:1fr;gap:32px;margin-top:8px;}
@media (min-width:1040px){.layout{grid-template-columns:1.55fr 1fr;align-items:start;}}

.section{margin-top:40px;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.section-head h2{font-size:20px;margin:0 0 4px;}
.section-head .sub{font-size:13.5px;color:var(--text-muted);margin:0;}
.step-badge{
  display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:8px;
  background:var(--badge-bg);color:var(--badge-fg);font-size:12px;font-weight:700;font-family:'Space Grotesk';margin-right:8px;
}

/* Paso 1: segmento */
.segment-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
@media (max-width:720px){.segment-grid{grid-template-columns:1fr;}}
.segment-card{
  text-align:left;border:1.5px solid var(--border);background:var(--surface);border-radius:var(--radius-md);
  padding:14px 16px;transition:border-color .15s ease, transform .1s ease;
}
.segment-card:hover{transform:translateY(-1px);}
.segment-card.active{border-color:var(--orange-1);background:var(--orange-soft);box-shadow:var(--shadow-sm);}
.segment-card .t{display:block;font-weight:700;font-size:14.5px;margin-bottom:3px;}
.segment-card .d{display:block;font-size:12.5px;color:var(--text-muted);line-height:1.4;}

/* Paso 2: producto + slider */
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
.product-card{
  position:relative;text-align:left;border:1.5px solid var(--border);background:var(--surface);
  border-radius:var(--radius-md);padding:18px;transition:border-color .15s ease, transform .12s ease, box-shadow .15s ease;
  display:flex;flex-direction:column;gap:10px;height:100%;
}
.product-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
.product-card.active{border-color:var(--orange-1);box-shadow:var(--shadow-md);}
.icon-wrap{
  width:42px;height:42px;border-radius:12px;background:var(--bg-alt);
  display:flex;align-items:center;justify-content:center;color:var(--orange-1);flex-shrink:0;
}
.product-card.active .icon-wrap,
.extra-card.on .icon-wrap{background:var(--accent-grad);color:#fff;}
.product-card .pname{font-weight:700;font-size:15px;}
.product-card .pdesc{font-size:12.5px;color:var(--text-muted);line-height:1.45;flex-grow:1;}
.product-card .prange{font-size:13px;font-weight:700;font-family:'Space Grotesk';}
.reco-badge{
  position:absolute;top:12px;right:12px;background:var(--badge-bg);color:var(--badge-fg);font-size:10px;font-weight:700;
  padding:3px 8px;border-radius:999px;letter-spacing:.02em;
}
.slider-card{margin-top:16px;border:1.5px solid var(--border);background:var(--surface-2);border-radius:var(--radius-md);padding:20px;}
.slider-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;flex-wrap:wrap;gap:6px;}
.slider-top .label{font-size:13px;color:var(--text-muted);font-weight:600;}
.slider-top .value{font-family:'Space Grotesk';font-weight:700;font-size:26px;}
.slider-top .value small{font-size:13px;color:var(--text-faint);font-weight:500;margin-left:6px;}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:var(--border);outline-offset:6px;margin:8px 0;}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent-grad);
  border:3px solid var(--surface);box-shadow:var(--shadow-md);cursor:pointer;
}
input[type=range]::-moz-range-track{height:6px;border-radius:999px;background:var(--border);}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--orange-1);border:3px solid var(--surface);box-shadow:var(--shadow-md);cursor:pointer;}
.range-labels{display:flex;justify-content:space-between;font-size:11.5px;color:var(--text-faint);}
.slider-note{margin:12px 0 0;font-size:12px;color:var(--text-muted);line-height:1.4;}

/* Paso 3: extras */
.cat-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);margin:20px 0 10px;}
.cat-title:first-child{margin-top:0;}
.extra-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;}
.extra-card{
  display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--border);background:var(--surface);
  border-radius:var(--radius-md);padding:14px;transition:border-color .15s ease;
}
.extra-card.on{border-color:var(--orange-1);background:var(--orange-soft);}
.extra-card .icon-wrap{width:36px;height:36px;border-radius:10px;}
.extra-card .body{display:block;flex-grow:1;}
.extra-card .ename{display:block;font-weight:700;font-size:13.5px;margin-bottom:2px;}
.extra-card .esubtitle{display:block;font-size:11.5px;color:var(--text-muted);margin-bottom:4px;line-height:1.35;}
.extra-card .eprice{display:block;font-size:12.5px;color:var(--text-muted);font-weight:600;}
.extra-card .emonthly{display:block;font-size:11px;color:var(--orange-1);font-weight:700;margin-top:2px;}
.checkbox{
  width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border);flex-shrink:0;margin-top:1px;
  display:flex;align-items:center;justify-content:center;color:#fff;transition:all .15s ease;
}
.extra-card.on .checkbox{background:var(--accent-grad);border-color:transparent;}
.checkbox .icon{width:12px;height:12px;}

/* Paso 4: mantenimiento */
.maint-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
@media (max-width:820px){.maint-grid{grid-template-columns:repeat(2,1fr);}}
.maint-card{text-align:left;border:1.5px solid var(--border);background:var(--surface);border-radius:var(--radius-md);padding:14px;}
.maint-card.active{border-color:var(--orange-1);background:var(--orange-soft);}
.maint-card .mname{display:block;font-weight:700;font-size:13.5px;margin-bottom:4px;}
.maint-card .mprice{display:block;font-size:12px;color:var(--text-muted);font-weight:600;}

/* Condiciones */
.terms{margin-top:52px;border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:24px;background:var(--bg-alt);}
.terms h3{font-size:15px;margin:0 0 12px;}
.terms ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;}
.terms li{font-size:12.5px;color:var(--text-muted);display:flex;gap:8px;align-items:flex-start;line-height:1.4;}
.terms li .icon{width:15px;height:15px;color:var(--orange-1);margin-top:1px;}

/* =====================================================================
   6. RESUMEN + LEAD
   ===================================================================== */
.summary{border:1.5px solid var(--border);background:var(--surface);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-md);}
@media (min-width:1040px){
  .summary{position:sticky;top:88px;max-height:calc(100vh - 104px);overflow-y:auto;}  /* botones siempre alcanzables */
}
.summary h3{font-size:15px;margin:0 0 14px;}
.sum-line{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--border);font-size:13px;gap:12px;}
.sum-line .l{color:var(--text-muted);flex-grow:1;}
.sum-line .r{font-weight:700;white-space:nowrap;}
.sum-sub{margin-top:14px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-faint);}
.total-block{margin-top:14px;padding-top:14px;border-top:1.5px solid var(--border);}
.total-block .tl{font-size:12px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
.total-block .tv{font-family:'Space Grotesk';font-weight:700;font-size:32px;margin:4px 0 2px;line-height:1;}
.total-block .tv2{font-size:13px;color:var(--text-faint);}
.monthly-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-alt);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;margin-top:10px;}
.monthly-chip[hidden]{display:none;}
.monthly-chip b{color:var(--orange-1);}

.chart-box{margin-top:18px;border-top:1px solid var(--border);padding-top:16px;}
.chart-box .ctitle{font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em;}
.chart-holder{position:relative;height:150px;}
.chart-holder.donut{height:190px;}

.lead-box{margin-top:20px;padding-top:18px;border-top:1px solid var(--border);}
.field{margin-bottom:10px;}
.field label{display:block;font-size:12px;font-weight:700;color:var(--text-muted);margin-bottom:5px;}
.field input{
  width:100%;border:1.5px solid var(--border);background:var(--bg-alt);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--text);
}
.field input:focus{outline:none;border-color:var(--orange-1);}
.field input.invalid{border-color:var(--danger);}

.cta-stack{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 14px;border-radius:12px;
  font-weight:700;font-size:13.5px;border:1px solid transparent;transition:transform .12s ease, opacity .15s ease;
}
.btn:hover{transform:translateY(-1px);opacity:.94;}
.btn span[data-icon]{display:inline-flex;}
.btn .icon{width:16px;height:16px;}
.btn-wa{grid-column:1 / -1;background:var(--wa);color:#fff;}
.btn-dark{background:var(--btn-dark-bg);border-color:var(--btn-dark-border);color:#fff;}
.btn-outline{background:transparent;border-color:var(--border);color:var(--text);}
.form-msg{min-height:16px;margin-top:8px;font-size:12px;font-weight:700;color:var(--orange-1);text-align:center;}
.form-msg.error{color:var(--danger);}
.consent{margin:10px 0 0;font-size:11px;line-height:1.4;color:var(--text-faint);text-align:center;}

footer.bottom{margin-top:40px;text-align:center;font-size:12px;color:var(--text-faint);padding-top:20px;border-top:1px solid var(--border);}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important;scroll-behavior:auto !important;}
}
</style>
</head>
<body>

<noscript><div class="no-js">Activa JavaScript para usar el cotizador.</div></noscript>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <div class="brand-mark">$</div>
      <div class="brand-text">
        <div class="name" data-t="brandName"></div>
        <div class="tag" data-t="brandTag"></div>
      </div>
    </div>
    <div class="controls-row">
      <div class="pill-group" id="countryToggle" role="group">
        <button type="button" class="pill-btn" data-country="co">🇨🇴 Colombia</button>
        <button type="button" class="pill-btn" data-country="pa">🇵🇦 Panamá</button>
      </div>
      <div class="pill-group" id="currencyToggle" role="group">
        <button type="button" class="pill-btn" data-currency="COP">COP</button>
        <button type="button" class="pill-btn" data-currency="USD">USD</button>
      </div>
      <div class="pill-group" id="langToggle" role="group">
        <button type="button" class="pill-btn" data-lang="es">ES</button>
        <button type="button" class="pill-btn" data-lang="en">EN</button>
      </div>
      <button type="button" class="icon-btn" id="themeToggle" data-ta="themeLabel"></button>
    </div>
  </div>
</header>

<div class="wrap">

  <section class="hero">
    <div class="hero-kicker"><span data-t="kicker"></span></div>
    <h1><span data-t="heroTitle1"></span> <span class="grad" data-t="heroTitle2"></span></h1>
    <p data-t="heroSub"></p>
  </section>

  <!-- Recomendador rápido -->
  <section class="reco" id="recoModule">
    <div class="reco-head">
      <h2 class="reco-title" data-t="recoTitle"></h2>
      <button type="button" class="icon-btn" id="recoClose" data-icon="x" data-ta="recoClose"></button>
    </div>
    <div class="reco-grid" id="recoGrid">
      <button type="button" class="reco-btn" data-reco="ventas" data-t="recoVentas"></button>
      <button type="button" class="reco-btn" data-reco="prospectos" data-t="recoProspectos"></button>
      <button type="button" class="reco-btn" data-reco="profesional" data-t="recoProfesional"></button>
      <button type="button" class="reco-btn" data-reco="citas" data-t="recoCitas"></button>
    </div>
  </section>

  <div class="layout">
    <main>
      <!-- PASO 1 -->
      <section class="section">
        <div class="section-head">
          <div>
            <h2><span class="step-badge">1</span><span data-t="step1Title"></span></h2>
            <p class="sub" data-t="step1Sub"></p>
          </div>
        </div>
        <div class="segment-grid" id="segmentGrid"></div>
      </section>

      <!-- PASO 2 -->
      <section class="section">
        <div class="section-head">
          <div>
            <h2><span class="step-badge">2</span><span data-t="step2Title"></span></h2>
            <p class="sub" data-t="step2Sub"></p>
          </div>
        </div>
        <div class="product-grid" id="productGrid"></div>

        <div class="slider-card">
          <div class="slider-top">
            <span class="label" data-t="sliderLabel"></span>
            <span class="value" id="sliderValue"></span>
          </div>
          <input type="range" id="pctSlider" min="0" max="100" value="0" data-ta="sliderLabel">
          <div class="range-labels"><span id="rangeMin"></span><span id="rangeMax"></span></div>
          <p class="slider-note" data-t="basePriceNote"></p>
        </div>
      </section>

      <!-- PASO 3 -->
      <section class="section">
        <div class="section-head">
          <div>
            <h2><span class="step-badge">3</span><span data-t="step3Title"></span></h2>
            <p class="sub" data-t="step3Sub"></p>
          </div>
        </div>
        <div id="extrasContainer"></div>
      </section>

      <!-- PASO 4 -->
      <section class="section">
        <div class="section-head">
          <div>
            <h2><span class="step-badge">4</span><span data-t="step4Title"></span></h2>
            <p class="sub" data-t="step4Sub"></p>
          </div>
        </div>
        <div class="maint-grid" id="maintGrid"></div>
      </section>

      <div class="terms">
        <h3 data-t="termsTitle"></h3>
        <ul id="termsList"></ul>
      </div>
    </main>

    <!-- RESUMEN + CAPTURA DE LEAD (único formulario) -->

const $ = id => document.getElementById(id);

const nativeCurrency = () => state.country === "co" ? "COP" : "USD";
const getProduct = () => PRODUCTS.find(p => p.id === state.productId);

const NF = {
  COP: new Intl.NumberFormat("es-CO", { maximumFractionDigits:0 }),
  USD: new Intl.NumberFormat("en-US", { maximumFractionDigits:0 }),
};
function fmt(value, currency){
  const v = Math.round(value);
  return currency === "COP" ? "$" + NF.COP.format(v) + " COP" : "US$" + NF.USD.format(v);
}
function convert(value, from, to){
  if(from === to) return value;
  return from === "COP" ? value / CONFIG.exchangeRate : value * CONFIG.exchangeRate;
}
const toDisplay = value => convert(value, nativeCurrency(), state.currency);   // valor nativo → moneda elegida
const money = value => fmt(toDisplay(value), state.currency);

function systemTheme(){
  try{ return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; }catch(e){ return "light"; }
}
const currentTheme = () => state.theme || systemTheme();
function applyTheme(){ document.documentElement.setAttribute("data-theme", currentTheme()); }

/* "Título (descripción)" → { title, desc }. Si no hay paréntesis usa el subtítulo del dato. */
function extraLabels(ex){
  const full = ex.name[state.lang];
  const m = full.match(/^(.*?)\s*\((.*)\)\s*$/);
  if(m) return { title:m[1], desc:m[2].charAt(0).toUpperCase() + m[2].slice(1) };
  return { title:full, desc:ex.subtitle[state.lang] };
}

const extraPrice   = ex => ex[state.country];
const extraMonthly = ex => (state.country === "co" ? ex.moCo : ex.moPa) || 0;
const maintValue   = plan => { const r = plan[state.country]; return (r[0] + r[1]) / 2; };   // punto medio del rango

function productNativeValue(prod){
  const [min, max] = prod[state.country];
  const step = ROUND_STEP[state.country];
  const raw = min + (max - min) * state.pct / 100;
  return Math.min(max, Math.max(min, Math.round(raw / step) * step));
}

  const prod = getProduct();
  const base = productNativeValue(prod);
  const selected = EXTRAS.filter(ex => state.extras.has(ex.id));
  const catSums = {};
  CATS.forEach(c => { catSums[c.id] = 0; });
  let extrasSum = 0, extrasMonthly = 0;
  selected.forEach(ex => {
    const v = extraPrice(ex);
    extrasSum += v;
    catSums[ex.cat] += v;
    extrasMonthly += extraMonthly(ex);
  });
  const maint = MAINT.find(m => m.id === state.maintenanceId) || MAINT[0];
  const maintMonthly = maintValue(maint);
  return {
    base, selected, extrasSum, extrasMonthly, maint, maintMonthly, catSums,
    setupTotal: base + extrasSum,
    monthlyTotal: extrasMonthly + maintMonthly,
  };
}

/* =====================================================================
   8. RENDER
   ===================================================================== */
function renderStaticText(){
  const dict = T[state.lang];
  document.documentElement.lang = state.lang;
  document.title = dict.pageTitle;
  document.querySelectorAll("[data-t]").forEach(el => { const v = dict[el.dataset.t]; if(v !== undefined) el.textContent = v; });
  document.querySelectorAll("[data-tp]").forEach(el => { el.placeholder = dict[el.dataset.tp] || ""; });
  document.querySelectorAll("[data-ta]").forEach(el => { el.setAttribute("aria-label", dict[el.dataset.ta] || ""); });
}

function renderToggles(){
  const mark = (groupId, attr, value) => {
    document.querySelectorAll("#" + groupId + " .pill-btn").forEach(b => {
      const on = b.dataset[attr] === value;
      b.classList.toggle("active", on);
      b.setAttribute("aria-pressed", String(on));
    });
  };
  mark("countryToggle", "country", state.country);
  mark("currencyToggle", "currency", state.currency);
  mark("langToggle", "lang", state.lang);
  $("themeToggle").innerHTML = icon(currentTheme() === "dark" ? "sun" : "moon");
}

function renderReco(){
  document.querySelectorAll("#recoGrid .reco-btn").forEach(b => {
    const on = b.dataset.reco === state.reco;
    b.classList.toggle("active", on);
    b.setAttribute("aria-pressed", String(on));
  });
}

function renderSegments(){
  $("segmentGrid").innerHTML = SEGMENTS.map(s => {
    const on = s.id === state.segment;
    return `<button type="button" class="segment-card${on ? " active" : ""}" data-seg="${s.id}" aria-pressed="${on}">
      <span class="t">${s.name[state.lang]}</span>
      <span class="d">${s.desc[state.lang]}</span>
    </button>`;
  }).join("");
}

function renderProducts(){
  $("productGrid").innerHTML = PRODUCTS.map(p => {
    const on = p.id === state.productId;
    const [min, max] = p[state.country];
    const reco = p.segs.includes(state.segment);
    return `<button type="button" class="product-card${on ? " active" : ""}" data-prod="${p.id}" aria-pressed="${on}">
      ${reco ? `<span class="reco-badge">${t("recommended")}</span>` : ""}
      <span class="icon-wrap">${icon(p.icon, "icon-lg")}</span>
      <span class="pname">${p.name[state.lang]}</span>
      <span class="pdesc">${p.desc[state.lang]}</span>
      <span class="prange">${money(min)} – ${money(max)}</span>
    </button>`;
  }).join("");
  renderSlider();
}

function renderSlider(){
  const prod = getProduct();
  const [min, max] = prod[state.country];
  $("pctSlider").value = state.pct;
  $("rangeMin").textContent = money(min);
  $("rangeMax").textContent = money(max);
  const approx = state.currency !== nativeCurrency() ? ` <small>(${t("approxNote")})</small>` : "";
  $("sliderValue").innerHTML = money(productNativeValue(prod)) + approx;
}

function renderExtras(){
  $("extrasContainer").innerHTML = CATS.map(cat => {
    const cards = EXTRAS.filter(e => e.cat === cat.id).map(ex => {
      const on = state.extras.has(ex.id);
      const { title, desc } = extraLabels(ex);
      const mo = extraMonthly(ex);
      return `<button type="button" class="extra-card${on ? " on" : ""}" data-extra="${ex.id}" aria-pressed="${on}">
        <span class="icon-wrap">${icon(ex.icon)}</span>
        <span class="body">
          <span class="ename">${title}</span>
          <span class="esubtitle">${desc}</span>
          <span class="eprice">+${money(extraPrice(ex))}</span>
          ${mo ? `<span class="emonthly">+${money(mo)} / ${t("perMonth")}</span>` : ""}
        </span>
        <span class="checkbox">${on ? icon("check2") : ""}</span>
      </button>`;
    }).join("");
    return cards ? `<div class="cat-title">${cat.name[state.lang]}</div><div class="extra-grid">${cards}</div>` : "";
  }).join("");
}

function renderMaintenance(){
  $("maintGrid").innerHTML = MAINT.map(m => {
    const on = m.id === state.maintenanceId;
    const [a, b] = m[state.country];
    const price = (a === 0 && b === 0) ? "—" : `${money(a)}–${money(b)} / ${t("perMonth")}`;
    return `<button type="button" class="maint-card${on ? " active" : ""}" data-maint="${m.id}" aria-pressed="${on}">
      <span class="mname">${m.name[state.lang]}</span>
      <span class="mprice">${price}</span>
    </button>`;
  }).join("");
}

function renderTerms(){
  $("termsList").innerHTML = t("terms").map(txt => `<li>${icon("circleTerm")}<span>${txt}</span></li>`).join("");
}

function renderSummary(){
  const totals = computeTotals();
  const prod = getProduct();
  const cur = state.currency, nat = nativeCurrency();
  const other = cur === "COP" ? "USD" : "COP";
  const line = (label, value) => `<div class="sum-line"><span class="l">${label}</span><span class="r">${value}</span></div>`;

  let html = line(`${t("lineBase")} — ${prod.name[state.lang]}`, money(totals.base));
  totals.selected.forEach(ex => { html += line(extraLabels(ex).title, money(extraPrice(ex))); });

  if(totals.monthlyTotal > 0){
    html += `<div class="sum-sub">${t("monthlySection")}</div>`;
    totals.selected.filter(ex => extraMonthly(ex) > 0).forEach(ex => {
      html += line(extraLabels(ex).title, money(extraMonthly(ex)));
    });
    if(totals.maintMonthly > 0) html += line(`${t("maintLine")} — ${totals.maint.name[state.lang]}`, money(totals.maintMonthly));
  }
  $("summaryLines").innerHTML = html;

  $("totalMain").textContent = fmt(toDisplay(totals.setupTotal), cur);
  $("totalAlt").textContent = "≈ " + fmt(convert(totals.setupTotal, nat, other), other);

  const chip = $("monthlyChip");
  if(totals.monthlyTotal > 0){
    chip.hidden = false;
    chip.innerHTML = `🔁 <b>${money(totals.monthlyTotal)}</b> / ${t("perMonth")} · ${t("recurring")}`;
  }else{
    chip.hidden = true;
  }

  renderCharts(totals);
}

function renderAll(){
  renderStaticText();
  renderToggles();
  renderReco();
  renderSegments();
  renderProducts();
  renderExtras();
  renderMaintenance();
  renderTerms();
  renderSummary();
}

/* =====================================================================
   9. GRÁFICOS (se crean una vez y luego solo se actualizan)
   ===================================================================== */
let barChart = null, donutChart = null;

function chartColors(){
  const s = getComputedStyle(document.documentElement);
  const v = name => s.getPropertyValue(name).trim();
  const dark = currentTheme() === "dark";
  return {
    muted:v("--text-muted"), surface:v("--surface"),
    orange1:v("--orange-1"), orange2:v("--orange-2"),
    black: dark ? "#3a352d" : v("--black"),
    refBar: dark ? "#4a443b" : v("--border"),
  };
}

function renderCharts(totals){
  if(!window.Chart) return;                       // si el CDN falla, el cotizador sigue funcionando
  const c = chartColors();
  const cur = state.currency, nat = nativeCurrency();
  Chart.defaults.font.family = "Manrope, system-ui, sans-serif";

  /* --- Barras: tu cotización vs. paquetes de referencia --- */
  const barLabels = REF_PACKAGES.map(p => p.name[state.lang]).concat([t("yourQuote")]);
  const barData = REF_PACKAGES.map(p => toDisplay(p[state.country])).concat([toDisplay(totals.setupTotal)]);
  if(!barChart){
    barChart = new Chart($("barChart"), {
      type:"bar",
      data:{ labels:[], datasets:[{ data:[], borderRadius:8, maxBarThickness:34 }] },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{ display:false },
          tooltip:{ callbacks:{ label: ctx => fmt(ctx.parsed.y, state.currency) }, titleColor:"#fff", bodyColor:"#fff", padding:10, cornerRadius:8 }
        },
        scales:{ x:{ grid:{ display:false }, ticks:{ font:{ size:10.5 } } }, y:{ display:false, beginAtZero:true } }
      }
    });
  }
  barChart.data.labels = barLabels;
  barChart.data.datasets[0].data = barData;
  barChart.data.datasets[0].backgroundColor = [c.refBar, c.refBar, c.refBar, c.orange1];
  barChart.options.scales.x.ticks.color = c.muted;
  barChart.options.plugins.tooltip.backgroundColor = c.black;
  barChart.update("none");

  /* --- Dona: base + categorías con valor (color fijo por categoría) --- */
  const catColor = { infra:c.orange1, automation:c.orange2, commerce:"#C9A27A", ai:"#8A8377" };
  const items = [{ label:t("lineBase"), value:totals.base, color:c.black }].concat(
    CATS.filter(cat => totals.catSums[cat.id] > 0)
        .map(cat => ({ label:cat.name[state.lang], value:totals.catSums[cat.id], color:catColor[cat.id] }))
  );
  if(!donutChart){
    donutChart = new Chart($("donutChart"), {
      type:"doughnut",
      data:{ labels:[], datasets:[{ data:[], borderWidth:3 }] },
      options:{
        responsive:true, maintainAspectRatio:false, cutout:"62%",
        plugins:{
          legend:{ position:"bottom", labels:{ boxWidth:10, boxHeight:10, padding:10, font:{ size:10.5 } } },
          tooltip:{ callbacks:{ label: ctx => ctx.label + ": " + fmt(ctx.parsed, state.currency) }, titleColor:"#fff", bodyColor:"#fff", padding:10, cornerRadius:8 }
        }
      }
    });
  }
  donutChart.data.labels = items.map(i => i.label);
  donutChart.data.datasets[0].data = items.map(i => convert(i.value, nat, cur));
  donutChart.data.datasets[0].backgroundColor = items.map(i => i.color);
  donutChart.data.datasets[0].borderColor = c.surface;
  donutChart.options.plugins.legend.labels.color = c.muted;
  donutChart.options.plugins.tooltip.backgroundColor = c.black;
  donutChart.update("none");
}

/* =====================================================================
   10. ACCIONES DEL LEAD (WhatsApp · PDF · Copiar · Webhook)
   ===================================================================== */
let msgTimer = null;
function showMsg(text, isError){
  const el = $("formMsg");
  el.textContent = text;
  el.classList.toggle("error", !!isError);
  clearTimeout(msgTimer);
  if(text) msgTimer = setTimeout(() => { el.textContent = ""; }, isError ? 4500 : 2200);
}

function getLead(){
  return { name: $("leadName").value.trim(), contact: $("leadContact").value.trim() };
}

/* Nombre obligatorio + contacto válido (email o teléfono con 7+ dígitos) */
function validateLead(){
  const lead = getLead();
  const okName = lead.name.length >= 2;
  const isEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(lead.contact);
  const okContact = isEmail || lead.contact.replace(/\D/g, "").length >= 7;
  $("leadName").classList.toggle("invalid", !okName);
  $("leadContact").classList.toggle("invalid", !okContact);
  if(!okName || !okContact){
    showMsg(t("errFields"), true);
    (okName ? $("leadContact") : $("leadName")).focus();
    return null;
  }
  return lead;
}

function buildSummaryText(lead){
  const totals = computeTotals();
  const L = [t("waIntro")];
  if(lead.name) L.push(`${t("waName")}: ${lead.name}`);
  if(lead.contact) L.push(`${t("waContact")}: ${lead.contact}`);
  L.push(`${t("waCountry")}: ${t(state.country === "co" ? "countryCO" : "countryPA")}`);
  L.push(`${t("waType")}: ${getProduct().name[state.lang]}`);
  if(totals.selected.length){
    L.push(`${t("waExtras")}:`);
    totals.selected.forEach(ex => L.push("+ " + extraLabels(ex).title));
  }
  if(totals.maint.id !== "none") L.push(`${t("waMaint")}: ${totals.maint.name[state.lang]}`);
  L.push(`${t("waTotal")}: ${money(totals.setupTotal)}`);
  if(totals.monthlyTotal > 0) L.push(`${t("waMonthly")}: ${money(totals.monthlyTotal)}`);
  return L.join("\n");
}

/* Envía el lead a n8n / Make si CONFIG.webhookUrl está definido.
   Formulario url-encoded + no-cors: no requiere configurar CORS en el webhook. */
function sendLead(lead, action){
  if(!CONFIG.webhookUrl) return;
  try{
    const totals = computeTotals();
    const cur = state.currency, nat = nativeCurrency();
    const body = new URLSearchParams({
      accion: action,
      nombre: lead.name,
      contacto: lead.contact,
      pais: state.country,
      moneda: cur,
      idioma: state.lang,
      segmento: state.segment,
      sitio: state.productId,
      extras: totals.selected.map(e => e.id).join(","),
      mantenimiento: state.maintenanceId,
      total_implementacion: String(Math.round(convert(totals.setupTotal, nat, cur))),
      total_mensual: String(Math.round(convert(totals.monthlyTotal, nat, cur))),
      resumen: buildSummaryText(lead),
      fecha: new Date().toISOString(),
    });
    fetch(CONFIG.webhookUrl, { method:"POST", mode:"no-cors", body, keepalive:true }).catch(() => {});
  }catch(e){}
}

function sendWhatsApp(){
  const lead = validateLead();
  if(!lead) return;
  sendLead(lead, "whatsapp");
  const url = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(buildSummaryText(lead))}`;
  window.open(url, "_blank", "noopener");
}

function fallbackCopy(text){
  try{
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}
function copySummary(){
  const text = buildSummaryText(getLead());
  const done = () => showMsg(t("copied"));
  const fail = () => showMsg(t("errCopy"), true);
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(() => { fallbackCopy(text) ? done() : fail(); });
  }else{
    fallbackCopy(text) ? done() : fail();
  }
}

function downloadPDF(){
  const lead = validateLead();
  if(!lead) return;
  if(!(window.jspdf && window.jspdf.jsPDF)){ showMsg(t("errPdf"), true); return; }
  sendLead(lead, "pdf");

  const doc = new window.jspdf.jsPDF({ unit:"mm", format:"a4" });
  const totals = computeTotals();
  const cur = state.currency, nat = nativeCurrency();
  const other = cur === "COP" ? "USD" : "COP";
  const PAGE_W = 210, MX = 18, RIGHT = PAGE_W - MX;
  const safe = s => String(s).replace(/[—–]/g, "-").replace(/[^\x20-\x7E\xA0-\xFF]/g, "");   // las fuentes base del PDF solo soportan Latin-1
  const ink = () => doc.setTextColor(23, 21, 18);
  const muted = () => doc.setTextColor(110, 104, 95);
  let y = 0;
  const ensure = h => { if(y + h > 280){ doc.addPage(); y = 20; } };

  /* Encabezado */
  doc.setFillColor(14, 13, 12);   doc.rect(0, 0, PAGE_W, 30, "F");
  doc.setFillColor(255, 106, 26); doc.rect(0, 30, PAGE_W, 1.5, "F");
  doc.setTextColor(255, 255, 255);
  doc.setFont("helvetica", "bold");   doc.setFontSize(16); doc.text(safe(t("brandName")), MX, 14);
  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.text(safe(t("pdfTitle")), MX, 22);

  /* Datos del cliente */
  y = 44; ink(); doc.setFontSize(10);
  const meta = [
    [t("pdfDate"), new Date().toLocaleDateString(state.lang === "es" ? "es-CO" : "en-US")],
    [t("pdfClient"), lead.name],
    [t("pdfContact"), lead.contact],
    [t("pdfCountry"), `${t(state.country === "co" ? "countryCO" : "countryPA")} - ${cur}`],
  ];
  meta.forEach(([k, v]) => {
    doc.setFont("helvetica", "bold");   doc.text(safe(k) + ":", MX, y);
    doc.setFont("helvetica", "normal");
    const lines = doc.splitTextToSize(safe(v), RIGHT - MX - 34);
    doc.text(lines, MX + 34, y);
    y += Math.max(1, lines.length) * 5.5;
  });

  /* Helpers de tabla */
  const section = title => {
    ensure(16); y += 5;
    doc.setFillColor(241, 238, 232); doc.rect(MX, y - 5, RIGHT - MX, 8, "F");
    doc.setFont("helvetica", "bold"); doc.setFontSize(10); ink();
    doc.text(safe(title), MX + 2, y); y += 8;
  };
  const row = (label, amount, bold) => {
    doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(10); ink();
    const lines = doc.splitTextToSize(safe(label), 112);
    ensure(lines.length * 5 + 3);
    doc.text(lines, MX + 2, y);
    if(amount) doc.text(safe(amount), RIGHT - 2, y, { align:"right" });
    y += lines.length * 5;
    doc.setDrawColor(231, 226, 217); doc.line(MX, y - 2.5, RIGHT, y - 2.5);
    y += 2;
  };

  /* Implementación */
  section(t("pdfSetup"));
  row(`${t("lineBase")} - ${getProduct().name[state.lang]}`, money(totals.base));
  totals.selected.forEach(ex => row(extraLabels(ex).title, money(extraPrice(ex))));
  row(t("totalSetupLabel"), money(totals.setupTotal), true);
  ensure(8); muted(); doc.setFont("helvetica", "normal"); doc.setFontSize(9);
  doc.text(safe(`${t("pdfApprox")} ${fmt(convert(totals.setupTotal, nat, other), other)}`), RIGHT - 2, y + 1, { align:"right" });
  y += 6;

  /* Recurrente mensual */
  if(totals.monthlyTotal > 0){
    section(t("monthlySection"));
    totals.selected.filter(ex => extraMonthly(ex) > 0).forEach(ex => row(extraLabels(ex).title, money(extraMonthly(ex))));
    if(totals.maintMonthly > 0) row(`${t("maintLine")} - ${totals.maint.name[state.lang]}`, money(totals.maintMonthly));
    row(`Total / ${t("perMonth")}`, money(totals.monthlyTotal), true);
  }

  /* Condiciones y nota */
  section(t("termsTitle"));
  doc.setFont("helvetica", "normal"); doc.setFontSize(9); muted();
  t("terms").forEach(txt => {
    const lines = doc.splitTextToSize("- " + safe(txt), RIGHT - MX - 4);
    ensure(lines.length * 4.6 + 2);
    doc.text(lines, MX + 2, y);
    y += lines.length * 4.6 + 1.5;
  });
  y += 4;
  const note = doc.splitTextToSize(safe(t("footerNote")), RIGHT - MX);
  ensure(note.length * 4 + 4);
  doc.setFontSize(8); doc.text(note, MX, y);

  const clean = lead.name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\w]+/g, "_").replace(/^_+|_+$/g, "");
  doc.save(`${t("pdfFile")}_${clean || "cliente"}.pdf`);
}

/* =====================================================================
   11. EVENTOS (se registran una sola vez; las listas usan delegación)
   ===================================================================== */
function applyRecommendation(key){
  const r = RECOMMENDATIONS[key];
  if(!r) return;
  state.reco = key;
  state.productId = r.product;
  state.extras = new Set(r.extras);
  state.maintenanceId = r.maint;
  state.pct = segmentPct(state.segment);
  renderAll();
  if(matchMedia("(max-width:1039px)").matches){          // en móvil el resumen queda abajo: llévalo a la vista
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    $("summary").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block:"start" });
  }
}

function bindEvents(){
  /* Controles del header */
  $("countryToggle").addEventListener("click", e => {
    const b = e.target.closest("[data-country]"); if(!b) return;
    state.country = b.dataset.country;
    state.currency = nativeCurrency();
    savePrefs(); renderAll();
  });
  $("currencyToggle").addEventListener("click", e => {
    const b = e.target.closest("[data-currency]"); if(!b) return;
    state.currency = b.dataset.currency;
    savePrefs(); renderAll();
  });
  $("langToggle").addEventListener("click", e => {
    const b = e.target.closest("[data-lang]"); if(!b) return;
    state.lang = b.dataset.lang;
    savePrefs(); renderAll();
  });
  $("themeToggle").addEventListener("click", () => {
    state.theme = currentTheme() === "dark" ? "light" : "dark";
    savePrefs(); applyTheme(); renderAll();
  });

  /* Recomendador */
  $("recoGrid").addEventListener("click", e => {
    const b = e.target.closest("[data-reco]"); if(b) applyRecommendation(b.dataset.reco);
  });
  $("recoClose").addEventListener("click", () => { $("recoModule").hidden = true; });

  /* Pasos 1–4 */
  $("segmentGrid").addEventListener("click", e => {
    const b = e.target.closest("[data-seg]"); if(!b) return;
    state.segment = b.dataset.seg;
    state.pct = segmentPct(state.segment);
    renderAll();
  });
  $("productGrid").addEventListener("click", e => {
    const b = e.target.closest("[data-prod]"); if(!b) return;
    state.productId = b.dataset.prod; state.reco = null;
    renderAll();
  });
  $("pctSlider").addEventListener("input", e => {
    state.pct = parseInt(e.target.value, 10);
    renderSlider();
    renderSummary();
  });
  $("extrasContainer").addEventListener("click", e => {
    const b = e.target.closest("[data-extra]"); if(!b) return;
    const id = b.dataset.extra;
    if(state.extras.has(id)) state.extras.delete(id); else state.extras.add(id);
    state.reco = null;
    renderAll();
  });
  $("maintGrid").addEventListener("click", e => {
    const b = e.target.closest("[data-maint]"); if(!b) return;
    state.maintenanceId = b.dataset.maint; state.reco = null;
    renderAll();
  });

  /* Lead */
  $("leadName").addEventListener("input", e => e.target.classList.remove("invalid"));
  $("leadContact").addEventListener("input", e => e.target.classList.remove("invalid"));
  $("btnWhatsapp").addEventListener("click", sendWhatsApp);
  $("btnPdf").addEventListener("click", downloadPDF);
  $("btnCopy").addEventListener("click", copySummary);

  /* Si el usuario no eligió tema, seguir los cambios del sistema */
  try{
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if(!state.theme){ applyTheme(); renderAll(); }
    });
  }catch(e){}
}

/* =====================================================================
   12. INIT
   ===================================================================== */
function init(){
  loadPrefs();
  applyTheme();
  document.querySelectorAll("[data-icon]").forEach(el => { el.innerHTML = icon(el.dataset.icon); });
  bindEvents();
  renderAll();
}
init();

})();
